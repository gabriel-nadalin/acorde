server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web assets are content-hashed; serve them with long-lived caching.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # go_router uses hash URLs by default, but keep an SPA fallback so any
    # direct path request still boots the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
