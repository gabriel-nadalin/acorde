# Served by the `app` container (see docker-compose.yml). Two jobs:
#   1. serve the compiled Flutter web bundle,
#   2. reverse-proxy /api/ to the `pocketbase` service.
#
# (2) is what makes the deployment single-origin: the browser only talks to
# this server, so the bundle can be built with an empty PB_URL and there is no
# CORS preflight and no browser-reachability problem for the backend.
#
# nginx resolves the `pocketbase` hostname once, when this config is loaded. If
# the backend container is recreated and gets a new IP, restart this container
# (`docker compose restart app`) so the upstream address is resolved again.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cheap hardening. Note: nginx does not inherit add_header into a location
    # that declares its own add_header, which is why /assets/ repeats these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # PocketBase REST + realtime. The trailing slash on both sides keeps the
    # upstream path identical (/api/foo -> pocketbase:8090/api/foo).
    location /api/ {
        proxy_pass http://pocketbase:8090/api/;
        proxy_http_version 1.1;
        # With HTTP/1.1 above, clearing the hop-by-hop Connection header stops
        # nginx from sending `Connection: close` upstream (its default when the
        # client header is not forwarded), so a long-lived streaming response is
        # not force-closed by the proxy at the end of every response.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime is a long-lived Server-Sent-Events response. Buffering would
        # hold frames until the buffer fills (the UI would freeze), and the 60s
        # default read timeout would kill an idle subscription. Clients would
        # reconnect, but that reconnect storm is avoidable.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    # Flutter web assets are content-hashed; serve them with long-lived caching.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated because add_header is all-or-nothing per location.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # SPA fallback: any non-asset path boots the app, so deep links such as
    # /calendar/venue/<id> survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
