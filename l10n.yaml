# Configuration for `flutter gen-l10n` (also run implicitly when
# `generate: true` is set in pubspec.yaml).
arb-dir: lib/l10n
# Portuguese is the template AND the only shipped locale. The template is the file
# `flutter gen-l10n` generates the base class from and the one a missing key is
# reported against, so pointing it at the locale we actually ship keeps the two
# from being able to disagree.
template-arb-file: app_pt.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# Generated code lives next to the ARB files and is imported relatively, so it
# does not depend on the synthetic-package mechanism.
output-dir: lib/l10n
nullable-getter: false
