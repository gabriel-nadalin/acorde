# Analyzer configuration for the app, its tests, and the dev scripts.
#
# `flutter_lints` is the baseline Flutter recommends. The tree is kept clean
# under it — CI runs `flutter analyze` with infos fatal (see
# .github/workflows/ci.yml), so a new lint is a decision to make rather than
# background noise. Nothing is relaxed or added on top.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Build output. Never hand-edited, so its diagnostics are not actionable.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
